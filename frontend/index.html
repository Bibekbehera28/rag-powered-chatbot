<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-shell">
        <div class="chat-container">
            <!-- Header -->
            <header class="chat-header">

                <div class="header-content">

                    <div class="logo">
                        <img
                            src="https://cdn.vsoftconsulting.com/2026/05/VSoft-Logo.webp"
                            alt="VSoft"
                            class="brand-logo"
                            width="180"
                            height="48"
                        >
                    </div>

                    <button class="new-chat-btn" onclick="clearChat()">

                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">

                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>

                        </svg>

                        New Chat

                    </button>

                </div>

            </header>

            <!-- Messages -->
            <main class="messages-container" id="messagesContainer">

                <div class="welcome-message" id="welcomeMessage">

                    <div class="welcome-icon">

                        <svg width="48" height="48" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="1.5">

                            <circle cx="12" cy="12" r="10"></circle>

                            <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>

                            <line x1="9" y1="9" x2="9.01" y2="9"></line>

                            <line x1="15" y1="9" x2="15.01" y2="9"></line>

                        </svg>

                    </div>

                    <h1>How can I help you today?</h1>

                    <p>Ask me anything. I can help with coding, debugging, and explanations.</p>

                </div>

                <!-- Messages -->
                <div class="messages" id="messages" aria-live="polite"></div>

            </main>

            <!-- Input -->
            <footer class="input-container">

                <div class="input-wrapper">

                    <textarea
                        id="messageInput"
                        placeholder="Message AI Assistant..."
                        rows="1"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        spellcheck="false"
                        onkeydown="handleKeyDown(event)"
                        oninput="autoResize(this)"
                    ></textarea>

                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">

                        <svg width="20" height="20" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2">

                            <line x1="22" y1="2" x2="11" y2="13"></line>

                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>

                        </svg>

                    </button>

                </div>

                <p class="disclaimer">
                    AI can make mistakes. Verify important output.
                </p>

            </footer>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
    <script src="script.js"></script>

</body>
</html>
